# nginx 反代示例。要点：关掉这个站点的访问日志和错误日志，所有请求都转给 Node，不直接发项目目录里的文件。
server {
    listen 443 ssl http2;
    server_name canvas.example.com;

    ssl_certificate     /etc/ssl/canvas.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/canvas.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000";

    access_log off;
    error_log /dev/null crit;

    location / {
        proxy_pass http://127.0.0.1:3943;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # 限流按这个地址算。前面还有 Cloudflare 的话，改成传 CF-Connecting-IP，并且只允许 Cloudflare 回源。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 1m;
    }
}
